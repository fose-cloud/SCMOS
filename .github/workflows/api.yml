name: API

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/api.yml"
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/api.yml"
  # Any branch, to a slot. This is how a change is tried before it is merged —
  # the push trigger above only ever fires on main, so without this the only way
  # to see the code running on Azure was to release it.
  workflow_dispatch:
    inputs:
      slot:
        description: "Deployment slot (staging, or production to release)"
        type: choice
        options: [staging, production]
        default: staging
      migrate:
        description: "Apply EF migrations to that slot's database"
        type: boolean
        default: true

env:
  DOTNET_VERSION: "10.0.x"
  PROJECT: server/Scmos.Api/Scmos.Api.csproj

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - run: dotnet restore ${{ env.PROJECT }}

      # Warnings are errors here and nowhere else: the API is small enough that
      # a warning means something, and nobody reads a build log that is noisy.
      - run: dotnet build ${{ env.PROJECT }} --configuration Release --no-restore -warnaserror

      - run: dotnet publish ${{ env.PROJECT }} --configuration Release --no-build --output publish

      # The migration bundle travels with the build, so the deploy job applies
      # exactly the schema this code was compiled against and needs no SDK.
      - name: Build migration bundle
        run: |
          dotnet tool install --global dotnet-ef
          dotnet ef migrations bundle \
            --project ${{ env.PROJECT }} \
            --configuration Release \
            --self-contained -r linux-x64 \
            --output publish/migrate

      - uses: actions/upload-artifact@v4
        with:
          name: api
          path: publish

  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && github.event_name == 'push')
    runs-on: ubuntu-latest
    # A push to main releases; a manual run defaults to staging and says so.
    environment: ${{ github.event_name == 'push' && 'production' || inputs.slot }}
    permissions:
      id-token: write
      contents: read
    env:
      SLOT: ${{ github.event_name == 'push' && 'production' || inputs.slot }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: api
          path: publish

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Which database this slot's migrations go to.
      #
      # Staging gets its own connection string and nothing else. If it is not
      # set the deploy fails rather than falling back to production — a staging
      # deploy that quietly applies unreleased schema to the live database is
      # the worst thing this workflow could do, and a fallback is exactly how
      # that happens.
      #
      # Both secrets arrive as step environment variables rather than through a
      # step output: an output is written to a file on the runner and carried
      # between steps, and a connection string has no business making that trip.
      - name: Apply migrations
        if: github.event_name == 'push' || inputs.migrate
        env:
          PRODUCTION_CONNECTION: ${{ secrets.SCMOS_SQL_CONNECTION }}
          STAGING_CONNECTION: ${{ secrets.SCMOS_SQL_CONNECTION_STAGING }}
        run: |
          if [ "$SLOT" = "production" ]; then
            connection="$PRODUCTION_CONNECTION"
          else
            connection="$STAGING_CONNECTION"
          fi

          if [ -z "$connection" ]; then
            echo "::error::No connection string for slot '$SLOT'."
            echo "Set SCMOS_SQL_CONNECTION_STAGING to a database this slot may change."
            echo "Refusing to fall back to the production connection."
            exit 1
          fi

          chmod +x publish/migrate
          ./publish/migrate --connection "$connection"

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.API_APP_NAME }}
          slot-name: ${{ env.SLOT }}
          package: publish

      - name: Smoke test
        run: |
          if [ "$SLOT" = "production" ]; then
            base="https://${{ vars.API_APP_NAME }}.azurewebsites.net"
          else
            base="https://${{ vars.API_APP_NAME }}-$SLOT.azurewebsites.net"
          fi
          echo "Checking $base/health"
          # /health checks the database, and the database pauses itself after an
          # hour with nobody on it. Waking it was timed at 110 seconds, during
          # which the API answers nothing at all — a ten-second attempt reads
          # that as a dead deployment. One patient call to wake it first, so the
          # loop below is measuring the deployment rather than the resume.
          curl -s -o /dev/null --max-time 180 "$base/health" || true
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$base/health" || true)
            [ "$code" = "200" ] && { echo "healthy"; exit 0; }
            echo "  attempt $i: $code"
            sleep 10
          done
          echo "::error::$base/health never returned 200 — the slot is up but unhealthy."
          exit 1
