name: API

on:
  push:
    branches: [azure-dotnet-migration]
    paths:
      - "server/**"
      - ".github/workflows/api.yml"

  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/api.yml"

  workflow_dispatch:
    inputs:
      migrate:
        description: "Apply EF migrations to the production database"
        type: boolean
        default: true
      normaliseTypes:
        description: "Vehicle types: report what a cleanup would change, write it, or put the last run back"
        type: choice
        options: ["no", "report", "apply", "undo"]
        default: "no"
      linkIssues:
        description: "Operational issues: report which unlinked ones a container would attach to a job, or write it"
        type: choice
        options: ["no", "report", "apply"]
        default: "no"

env:
  DOTNET_VERSION: "10.0.x"
  PROJECT: server/Scmos.Api/Scmos.Api.csproj

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.PROJECT }}

      - name: Build
        run: dotnet build ${{ env.PROJECT }} --configuration Release --no-restore -warnaserror

      # The rule checks, before anything is published. They need no database and
      # no session — that is why they were written that way — so they cost a few
      # seconds and can refuse a build that has broken one of them.
      #
      # Delegation decides who may edit whose work; the type rule decides what a
      # vehicle is called across seven thousand jobs; the duplicate rule decides
      # which carrier spellings are one company; the scorecard decides what a
      # haulier is scored on. None of those should reach production unchecked.
      - name: Rule checks
        run: |
          for check in monitor delegation types duplicates scorecard; do
            echo "::group::--check-$check"
            dotnet run --project ${{ env.PROJECT }} --configuration Release --no-build               --no-launch-profile -- "--check-$check"
            echo "::endgroup::"
          done

      - name: Publish
        run: dotnet publish ${{ env.PROJECT }} --configuration Release --no-build --output publish

      - name: Build migration bundle
        run: |
          dotnet tool install --global dotnet-ef
          dotnet ef migrations bundle \
            --project ${{ env.PROJECT }} \
            --configuration Release \
            --self-contained -r linux-x64 \
            --output publish/migrate

      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: api
          path: publish

  deploy:
    needs: build

    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'push' &&
        github.ref == 'refs/heads/azure-dotnet-migration'
      )

    runs-on: ubuntu-latest

    environment: production

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download API artifact
        uses: actions/download-artifact@v4
        with:
          name: api
          path: publish

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Apply database migrations
        if: github.event_name == 'push' || inputs.migrate
        env:
          CONNECTION_STRING: ${{ secrets.SCMOS_SQL_CONNECTION }}
        run: |
          if [ -z "$CONNECTION_STRING" ]; then
            echo "::error::SCMOS_SQL_CONNECTION is not configured."
            exit 1
          fi

          chmod +x publish/migrate
          ./publish/migrate --connection "$CONNECTION_STRING"

      # The one-off pass over the vehicle types. It runs here because this is
      # where the connection string already lives — nobody has to copy a secret
      # anywhere to clean up a column.
      #
      # "report" writes nothing. "apply" copies every value it overwrites into
      # type_migration_backup in the same transaction, so "undo" can put the
      # register back exactly as it was.
      - name: Vehicle type cleanup
        if: github.event_name == 'workflow_dispatch' && inputs.normaliseTypes != 'no'
        env:
          ConnectionStrings__ScmosDb: ${{ secrets.SCMOS_SQL_CONNECTION }}
          ASPNETCORE_ENVIRONMENT: Production
        run: |
          if [ -z "$ConnectionStrings__ScmosDb" ]; then
            echo "::error::SCMOS_SQL_CONNECTION is not configured."
            exit 1
          fi

          case "${{ inputs.normaliseTypes }}" in
            report) extra="" ;;
            apply)  extra="--apply" ;;
            undo)   extra="--undo" ;;
          esac

          dotnet publish/Scmos.Api.dll --normalise-types $extra

      # Old issues carry a booking number where a job code was expected, so they
      # never linked and were counted against no carrier on the scorecard. This
      # attaches them by the container already on the row. It fills blanks only,
      # never replaces a link, and prints the id of every row it touches — so
      # "report" is safe to run whenever, and "apply" is undone by clearing the
      # ids it printed.
      - name: Link operational issues to their jobs
        if: github.event_name == 'workflow_dispatch' && inputs.linkIssues != 'no'
        env:
          ConnectionStrings__ScmosDb: ${{ secrets.SCMOS_SQL_CONNECTION }}
          ASPNETCORE_ENVIRONMENT: Production
        run: |
          if [ -z "$ConnectionStrings__ScmosDb" ]; then
            echo "::error::SCMOS_SQL_CONNECTION is not configured."
            exit 1
          fi

          extra=""
          [ "${{ inputs.linkIssues }}" = "apply" ] && extra="--apply"
          dotnet publish/Scmos.Api.dll --link-issues $extra

      - name: Deploy API to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.API_APP_NAME }}
          package: publish

      # The deploy writes into the wwwroot of a process that is still running,
      # and the process carries on with the assemblies it already loaded. Four
      # times on 2026-08-24 that left a "successful" deploy serving the previous
      # build: routes added by the deploy answering 404 while older ones
      # answered normally, and on the last one a health check failing outright
      # until the app was restarted by hand.
      #
      # WEBSITE_RUN_FROM_PACKAGE was tried and made it worse — with the package
      # mounted read-only the deploy reported success and changed nothing at all
      # — so it is a restart instead. It costs the cold start the smoke test
      # below already waits through, and it is what makes that smoke test mean
      # anything: without it, it can pass against the build it was meant to
      # replace.
      - name: Restart so the new build is the one running
        run: az webapp restart --name ${{ vars.API_APP_NAME }} --resource-group ${{ vars.AZURE_RESOURCE_GROUP }}

      - name: Smoke test
        run: |
          base="https://${{ vars.API_APP_NAME }}.azurewebsites.net"

          echo "Checking $base/health"

          curl -s -o /dev/null --max-time 180 "$base/health" || true

          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$base/health" || true)

            if [ "$code" = "200" ]; then
              echo "API healthy"
              exit 0
            fi

            echo "Attempt $i: HTTP $code"
            sleep 10
          done

          echo "::error::$base/health never returned HTTP 200."
          exit 1
