name: Web

on:
  push:
    branches: [main]
    paths-ignore:
      - "server/**"
      - "migration/**"
      - ".github/workflows/api.yml"
  pull_request:
    paths-ignore:
      - "server/**"
      - "migration/**"
      - ".github/workflows/api.yml"
  # Any branch, to a slot — see the note in api.yml.
  workflow_dispatch:
    inputs:
      slot:
        description: "Deployment slot (staging, or production to release)"
        type: choice
        options: [staging, production]
        default: staging

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - run: npm ci

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

      # `output: standalone` leaves the server in .next/standalone but not the
      # static assets or public/ — they are copied in beside it, which is what
      # the Next docs call for and what App Service then serves.
      - name: Assemble the deployment package
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          # The delivered plan seeds an empty database on a laptop. Served as a
          # static file it is the register — customer names, driver names,
          # driver phone numbers — handed to anyone App Service Login lets past
          # the door, without passing the API that decides who may read it.
          rm -f .next/standalone/public/data/ops.json
          echo "$GITHUB_SHA" > .next/standalone/deployment-version.txt
          test -f .next/standalone/.next/BUILD_ID

      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: .next/standalone
          # Next's executable bundle lives under `.next`. upload-artifact v4.4+
          # excludes hidden directories unless this is explicit; without it,
          # Azure receives server.js but keeps serving the previous `.next`.
          include-hidden-files: true


  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && github.event_name == 'push')
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'production' || inputs.slot }}
    permissions:
      id-token: write
      contents: read
    env:
      SLOT: ${{ github.event_name == 'push' && 'production' || inputs.slot }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: standalone

      - name: Verify the deployment package
        run: |
          test -f standalone/.next/BUILD_ID
          test "$(cat standalone/deployment-version.txt)" = "$GITHUB_SHA"

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.WEB_APP_NAME }}
          slot-name: ${{ env.SLOT }}
          package: standalone
          startup-command: "node server.js"

      - name: Verify the deployed commit
        run: |
          if [ "$SLOT" = "production" ]; then
            kudu="https://${{ vars.WEB_APP_NAME }}.scm.azurewebsites.net"
          else
            kudu="https://${{ vars.WEB_APP_NAME }}-$SLOT.scm.azurewebsites.net"
          fi
          token=$(az account get-access-token --resource https://management.azure.com/ --query accessToken -o tsv)
          actual=$(curl -fsS -H "Authorization: Bearer $token" "$kudu/api/vfs/site/wwwroot/deployment-version.txt" | tr -d '\r\n')
          if [ "$actual" != "$GITHUB_SHA" ]; then
            echo "::error::Azure serves commit '$actual', expected '$GITHUB_SHA'."
            exit 1
          fi
          echo "Azure serves commit $actual"

      - name: Smoke test
        run: |
          if [ "$SLOT" = "production" ]; then
            base="https://${{ vars.WEB_APP_NAME }}.azurewebsites.net"
          else
            base="https://${{ vars.WEB_APP_NAME }}-$SLOT.azurewebsites.net"
          fi
          echo "Checking $base"
          for i in $(seq 1 12); do
            # 200 is the app, 302 is Web App Login redirecting an anonymous
            # caller to Entra — both mean the site is up. Anything else is not.
            #
            # The User-Agent is not decoration. Web App Login only redirects
            # callers it takes for a browser; everything else gets a bare 401,
            # so this check called a healthy site broken on every run. Measured
            # against the deployed app: no UA and "curl/8.0" both give 401,
            # anything beginning "Mozilla/5.0" gives 302. Accept headers make no
            # difference either way.
            agent="Mozilla/5.0 (compatible; SCMOS-smoke/1.0)"
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 -H "User-Agent: $agent" "$base" || true)
            case "$code" in
              200|302) echo "up ($code)"; exit 0 ;;
            esac
            echo "  attempt $i: $code"
            sleep 10
          done
          echo "::error::$base never answered — the slot is deployed but not serving."
          exit 1
