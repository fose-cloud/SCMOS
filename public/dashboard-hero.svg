<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" preserveAspectRatio="xMidYMid slice">
  <!-- The dashboard's hero band: a night port, drawn rather than photographed,
       so the app ships without a stock image. Replace with a photograph by
       pointing ControlTower's hero at a /dashboard-hero.jpg. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b2a4a"/>
      <stop offset="0.7" stop-color="#071a31"/>
      <stop offset="1" stop-color="#06152a"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d3556"/>
      <stop offset="1" stop-color="#06152a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.35" r="0.45">
      <stop offset="0" stop-color="#2b8fd6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2b8fd6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#7fbfff" fill-opacity="0.35"/>
    </pattern>
  </defs>
  <rect width="1200" height="240" fill="url(#sky)"/>
  <rect width="1200" height="240" fill="url(#glow)"/>
  <!-- a lattice of routes across the upper right -->
  <g stroke="#5cc0f7" stroke-opacity="0.22" fill="none" stroke-width="1">
    <path d="M620 40 C 760 10, 900 60, 1060 30"/>
    <path d="M640 90 C 780 60, 940 120, 1120 70"/>
    <path d="M700 140 C 820 100, 980 160, 1180 110"/>
    <path d="M760 30 C 800 90, 880 140, 960 190"/>
    <path d="M900 20 C 930 80, 1000 130, 1080 200"/>
  </g>
  <g fill="#8ed4ff" fill-opacity="0.8">
    <circle cx="620" cy="40" r="2"/><circle cx="1060" cy="30" r="2"/><circle cx="640" cy="90" r="2"/>
    <circle cx="1120" cy="70" r="2.5"/><circle cx="960" cy="190" r="2"/><circle cx="1080" cy="200" r="2"/>
    <circle cx="900" cy="20" r="1.5"/><circle cx="1180" cy="110" r="2"/><circle cx="760" cy="30" r="1.5"/>
  </g>
  <rect x="560" y="0" width="640" height="240" fill="url(#dots)" opacity="0.5"/>
  <!-- the water -->
  <rect x="0" y="176" width="1200" height="64" fill="url(#sea)"/>
  <!-- gantry cranes on the horizon -->
  <g fill="#0a2240" stroke="#4a94d6" stroke-opacity="0.45" stroke-width="1.2">
    <path d="M760 176 V96 H772 V176 Z M840 176 V96 H852 V176 Z M752 100 H900 V108 H752 Z M900 100 L930 126 V176 H922 V130 L896 108 Z"/>
    <path d="M980 176 V88 H992 V176 Z M1070 176 V88 H1082 V176 Z M972 92 H1130 V100 H972 Z M1130 92 L1160 120 V176 H1152 V124 L1126 100 Z"/>
    <path d="M540 176 V112 H550 V176 Z M600 176 V112 H610 V176 Z M534 116 H640 V123 H534 Z"/>
  </g>
  <!-- container stacks -->
  <g stroke="#4a94d6" stroke-opacity="0.35" stroke-width="1">
    <rect x="770" y="150" width="60" height="12" fill="#123a5e"/><rect x="770" y="136" width="60" height="12" fill="#0f3251"/><rect x="770" y="122" width="60" height="12" fill="#144268"/>
    <rect x="1000" y="150" width="60" height="12" fill="#0f3251"/><rect x="1000" y="136" width="60" height="12" fill="#144268"/>
    <rect x="1062" y="150" width="60" height="12" fill="#123a5e"/>
    <rect x="556" y="152" width="40" height="10" fill="#123a5e"/><rect x="556" y="140" width="40" height="10" fill="#0f3251"/>
  </g>
  <!-- reflections -->
  <g stroke="#5cc0f7" stroke-opacity="0.18" stroke-width="2">
    <path d="M766 182 h64 M766 190 h48 M766 198 h56"/>
    <path d="M986 182 h90 M986 190 h70 M986 198 h84"/>
    <path d="M544 182 h64 M544 190 h40"/>
  </g>
  <!-- a wordmark ghosted top right, the way the design's photo carries one -->
  <text x="1010" y="52" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="18" font-weight="600" letter-spacing="4" fill="#e8f2fb" fill-opacity="0.55">LESCHACO</text>
</svg>
